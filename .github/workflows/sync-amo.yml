name: Sync AMO Descriptions

concurrency:
  group: amo-api

on:
  push:
    branches: [main]
    paths:
      - .github/README*.md
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: AMO
      url: https://addons.mozilla.org/firefox/addon/adaptive-tab-bar-colour/
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Synchronise AMO Descriptions
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: bash scripts/sync-amo.sh
